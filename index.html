<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>KSU Coffee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f3ee;
            margin: 40px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #5a3825; }
        .student-id { font-weight: bold; color: #777; }
        .version { color: #888; font-style: italic; }
        .menu-list { list-style: none; padding: 0; }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }
        .price { font-weight: bold; color: #a0522d; }
        .btn-promo {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #5a3825;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-promo:hover {
            background-color: #3b2418;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ร้าน KSU Coffee</h1>
        <p class="student-id">รหัสนักศึกษา: 681540006001-3</p>
        <p class="version">Menu v2</p>
        <ul class="menu-list">
            <li class="menu-item"><span>Espresso</span><span class="price">45 ฿</span></li>
            <li class="menu-item"><span>Americano</span><span class="price">50 ฿</span></li>
            <li class="menu-item"><span>Latte</span><span class="price">55 ฿</span></li>
            <li class="menu-item"><span>Cappuccino</span><span class="price">60 ฿</span></li>
        </ul>
        <a class="btn-promo" href="http://localhost:8081">ดูโปรโมชั่น</a>
    </div>
</body>
</html>
